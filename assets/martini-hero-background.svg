<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" preserveAspectRatio="none">
  <defs>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="4" seed="18" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.78 0 0 0 0 0.68 0 0 0 0 0.48 0 0 0 .18 0"/>
    </filter>
    <filter id="water" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .026" numOctaves="4" seed="7" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="32" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <radialGradient id="centerLight" cx="54%" cy="34%" r="58%">
      <stop offset="0" stop-color="#fffdf6" stop-opacity=".82"/>
      <stop offset=".52" stop-color="#fff9ed" stop-opacity=".34"/>
      <stop offset="1" stop-color="#fff9ed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldLine" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#b38c31" stop-opacity=".9"/>
      <stop offset=".58" stop-color="#b38c31" stop-opacity=".55"/>
      <stop offset="1" stop-color="#b38c31" stop-opacity=".16"/>
    </linearGradient>
  </defs>

